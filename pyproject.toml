[project]
name = "dcore"
version = "0.1.0"
description = "Byte-exact decompilation for shipped binaries: core loop + arch/platform packs"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "capstone>=5.0.9",   # arch packs disassemble function bytes to rebuild relocations
    "pyelftools>=0.33",  # the ELF platform pack reads DWARF
    "mcp>=2.3.0",        # backends talk MCP; the app exposes MCP to agents
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[project.scripts]
dcore = "dcore.app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
